# 就近文意規則 (Local Context Rules)
local_context_rules:
  "開發":
    - pattern: "產品[之的]?開發"
      skill_id: "KS1270P6SLFCFT476Y3R"  # 新產品開發

# 職稱消歧規則 (Title Disambiguation)
