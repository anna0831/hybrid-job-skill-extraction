# Phase 4: 風險分流路由器設定 (Risk-based Routing Rules)
routing_rules:
  risk_threshold: 0.5                  # 風險閾值：>= 0.5 送入 LLM 驗證，< 0.5 直接直通放行 (PASS_THROUGH)
  target_llm_budget_ratio: 0.20        # 預期 LLM 呼叫上限比例 (20%)
  
  # 高風險歧義關鍵字（多義詞、易與生活用語混淆）
  risky_keywords:
    - "清潔"
    - "研究"
    - "月薪"
    - "底薪"
    - "薪資"
    - "教育訓練"
    - "訓練"
    - "溝通"
    - "管理"
    - "維護"
    - "操作"

  # 福利、待遇與日常環境特徵詞（與薪資管理、教育訓練、清潔衝突）
  benefit_markers:
    - "底薪"
    - "月薪"
    - "薪資"
    - "待遇"
    - "年終"
    - "全勤"
    - "供餐"
    - "員工旅遊"
    - "提供教育訓練"
    - "勞健保"

  # 學歷與學術教育機構名詞（與研究衝突）
  academic_markers:
    - "研究所"
    - "大學畢業"
    - "碩士以上"
    - "博士學位"
    - "學士"

  # 跨團隊協作者與介面角色標記（防止將協作夥伴技能歸屬於應徵者）
  collaborator_markers:
    - "配合後端"
    - "配合前端"
    - "與後端"
    - "與前端"
    - "後端 Python"
    - "協助工程師"

  # 高信賴度來源欄位（直接降低風險分數）
  high_trust_sources:
    - "工作技能"
    - "擅長工具"
    - "工具欄"
