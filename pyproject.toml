[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-job-skill-extraction"
version = "0.1.0"
description = "Hybrid Job Skill Extraction System using Aho-Corasick, Risk-based Routing, and LLM Verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyahocorasick>=2.0.0",
    "jieba>=0.42.0",
    "nltk>=3.8.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
